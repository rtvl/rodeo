name: Create Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v2.5.3)'
        required: true
        type: string

jobs:
  build-all-platforms:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            platform: mac
            artifact: '*.dmg'
          - os: ubuntu-latest
            platform: linux
            artifact: '*.AppImage'
          - os: windows-latest
            platform: win
            artifact: '*.exe'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Build distributable (macOS)
        if: matrix.os == 'macos-latest'
        run: ./node_modules/.bin/electron-builder --mac dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build distributable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ./node_modules/.bin/electron-builder --linux AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build distributable (Windows)
        if: matrix.os == 'windows-latest'
        run: ./node_modules/.bin/electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Rodeo-${{ matrix.platform }}
          path: dist/${{ matrix.artifact }}
          retention-days: 90

  create-release:
    needs: build-all-platforms
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: Rodeo ${{ inputs.version }}
          draft: false
          prerelease: false
          files: |
            Rodeo-mac/*.dmg
            Rodeo-linux/*.AppImage
            Rodeo-win/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
